<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Closed Tabs Report - Tab Sweeper</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Closed Tabs Report</h1>

    <script src="saved.js"></script>
