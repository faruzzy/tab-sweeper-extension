<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tab Sweeper</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container popup">
      <h1>Tab Sweeper</h1>
      <p id="summary" class="muted">Loading...</p>
      <section id="warnedSection" class="warned-section" hidden>
        <h2>Warned Tabs</h2>
        <ul id="warnedList" class="warned-list"></ul>
      </section>
      <section class="row">
        <button id="sweepNow">Run Sweep</button>
        <button id="openOptions" class="secondary">Settings</button>
      </section>
      <section class="row">
        <button id="openSaved" class="secondary">Saved Tabs</button>
      </section>
      <p id="status" class="status"></p>
    </main>
    <script src="popup.js" type="module"></script>
  </body>
</html>
